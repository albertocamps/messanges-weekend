let data=JSON.parse(localStorage.getItem("messangesData")||"null")||initial;Object.keys(initial).forEach(cat=>{if(!(cat in data))data[cat]=initial[cat]});if(!data.Playlist)data.Playlist=[];if(!data["Ubicación"])data["Ubicación"]=[];saveMigration();function saveMigration(){localStorage.setItem("messangesData",JSON.stringify(data))}if(data["Música"])data["Música"]=data["Música"].filter(it=>!String(it[0]).startsWith("Playlist ·"));
const save=()=>localStorage.setItem("messangesData",JSON.stringify(data)),nav=document.getElementById("nav"),main=document.getElementById("main");let active="Hoy";
function render(){nav.innerHTML="";main.innerHTML="";Object.keys(data).forEach(cat=>{const b=document.createElement("button");b.textContent=cat;b.className=cat===active?"active":"";b.dataset.cat=cat;b.onclick=()=>{document.querySelector(`.card[data-cat="${cat}"]`)?.scrollIntoView({behavior:"smooth",block:"start"})};nav.appendChild(b);const c=document.createElement("div");c.className="card";c.dataset.cat=cat;c.innerHTML='<span class="badge">'+cat+'</span><h2>'+(cat==="Salir"?"Antes de salir":cat)+'</h2>';if(cat==="Salir")c.innerHTML+='<blockquote>Móvil · llaves · documentación · comida fría · instrumentos · sábanas y toallas.</blockquote>';if(cat==="Playlist")c.innerHTML+='<p class="muted">Tus tres ambientes del fin de semana. Pulsa para abrirlos directamente en Spotify.</p><div class="spotify-links"><a class="spotify-btn" href="https://open.spotify.com/playlist/6pDwnLKVSpQLUwmrLRCmrN" target="_blank" rel="noopener"><span>🏡 Cabaña</span><small>Abrir en Spotify ↗</small></a><a class="spotify-btn" href="https://open.spotify.com/playlist/61Tg5qqbhdQzzZmTQAUyvL" target="_blank" rel="noopener"><span>❤️ Intimidad</span><small>Abrir en Spotify ↗</small></a><a class="spotify-btn" href="https://open.spotify.com/playlist/3ON65YGYsgLxtl9voVngVx" target="_blank" rel="noopener"><span>🌲 Ritual Bosque</span><small>Abrir en Spotify ↗</small></a></div>';if(cat==="Ubicación")c.innerHTML+='<p class="muted">Acceso directo a la ubicación de la cabaña.</p><div class="spotify-links"><a class="spotify-btn" href="https://goo.gl/maps/ynhfN6UF6VenWSvL9" target="_blank" rel="noopener"><span>📍 Cabaña en Messanges</span><small>Abrir en Google Maps ↗</small></a></div>';data[cat].forEach((it,i)=>{const row=document.createElement("label");row.className="item "+(it[1]?"done":"");const cb=document.createElement("input");cb.type="checkbox";cb.checked=it[1];cb.onchange=()=>{data[cat][i][1]=cb.checked;save();render()};const sp=document.createElement("span");sp.textContent=it[0];if(cat==="Equipaje"&&i<2)sp.className="important";const del=document.createElement("button");del.type="button";del.className="delete-btn";del.textContent="✕";del.setAttribute("aria-label","Eliminar");del.onclick=e=>{e.preventDefault();e.stopPropagation();const nombre=String(it[0]);if(confirm(`Eliminar “${nombre}”\n\n¿Estás seguro?`)){data[cat].splice(i,1);save();render()}};row.append(cb,sp,del);c.appendChild(row)});if(cat!=="Playlist"&&cat!=="Ubicación"){const add=document.createElement("div");add.className="add";add.innerHTML='<input placeholder="Añadir algo a '+cat+'…"><button>+</button>';const inp=add.querySelector("input"),btn=add.querySelector("button");btn.onclick=()=>{if(inp.value.trim()){data[cat].push([inp.value.trim(),false]);save();render()}};inp.onkeydown=e=>{if(e.key==="Enter")btn.click()};c.appendChild(add)}main.appendChild(c)});requestAnimationFrame(setupScrollSpy)}

let spy=null;function setupScrollSpy(){if(spy)spy.disconnect();const cards=[...document.querySelectorAll(".card")];spy=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>Math.abs(a.boundingClientRect.top-145)-Math.abs(b.boundingClientRect.top-145));if(visible[0])setActive(visible[0].target.dataset.cat)},{rootMargin:"-135px 0px -55% 0px",threshold:[0,.1,.5]});cards.forEach(c=>spy.observe(c))}
